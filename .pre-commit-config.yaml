repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace      # 删除行尾空格
      - id: end-of-file-fixer        # 确保文件以换行结尾
      - id: check-yaml               # 校验 YAML 语法
      - id: check-added-large-files  # 阻止提交过大的文件
      - id: check-merge-conflict     # 检查合并冲突标记

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff (lint & fix)
        args: [ --fix ]
      - id: ruff
        name: ruff (sort imports)
        args: [ --select, I001, --fix ]
      - id: ruff-format
